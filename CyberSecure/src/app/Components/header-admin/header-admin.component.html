



<header class="header-style-3">

  <div class="menu-wrapper">
    <div class="header-mid">
      <div class="container">
        <div class="row align-items-center justify-content-between">

          <!-- Socials -->
          <div class="col-xl-4 col-lg-4">
            <div class="header-socials d-none d-lg-block">
              <ul class="list-inline mb-0">
                <li class="list-inline-item"><a href="#"><i class="fab fa-facebook-f"></i></a></li>
                <li class="list-inline-item"><a href="#"><i class="fab fa-twitter"></i></a></li>
                <li class="list-inline-item"><a href="#"><i class="fab fa-linkedin-in"></i></a></li>
                <li class="list-inline-item"><a href="#"><i class="fab fa-pinterest"></i></a></li>
                <li class="list-inline-item"><a href="#"><i class="fab fa-youtube"></i></a></li>
              </ul>
            </div>
          </div>

          <!-- Logo -->
          <div class="col-5 col-xl-3 col-lg-3 col-sm-4 col-md-3">
            <div class="site-logo">
              <a href="index.html">
                <img src="../../../assets/images/logo.png" alt="logo" class="img-fluid">
              </a>
            </div>
          </div>

          <!-- Icons / Mobile Burger -->
          <div class="col-7 col-xl-4 col-lg-4 col-sm-8">
            <div class="offcanvas-icon d-block d-lg-none text-end">
              <a href="#" class="nav-toggler" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu3">
                <i class="fal fa-bars"></i>
              </a>
            </div>

            <div class="float-end d-none d-lg-block">
              <div class="header-info d-flex align-items-center">
                <div class="header-user ms-3">
                  <a href="/mainAdmin/profile"><i class="fa fa-user"></i></a>
                </div>
                <div class="header-user ms-3">
                  <a *ngIf="isAuthenticated" href="#" data-bs-toggle="modal" data-bs-target="#logoutModal">
                    <i class="fa fa-sign-out-alt"></i>
                  </a>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

<div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content custom-modal">

      <div class="modal-header logout-header">
        <h5 class="modal-title" id="logoutModalLabel">
          <i class="fa fa-sign-out-alt me-2"></i>Confirm Logout
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body text-center">
        <p class="logout-text">Are you sure you want to log out?</p>
      </div>

      <div class="modal-footer justify-content-center">
        <button type="button" class="btn-cancel" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn-gradient" (click)="confirmLogout()">Logout</button>
      </div>
    </div>
  </div>
</div>


    <!-- Navbar Desktop -->
    <div class="header-navbar menu-center style-1">
      <div class="container">
        <nav class="site-navbar d-none d-lg-block">
          <ul class="primary-menu mb-0">
            <li class="current"><a class="contact-link" href="mainAdmin/home">Home</a></li>
            <li><a class="contact-link" href="mainAdmin/usersList">Users</a></li>
            <li><a class="contact-link" href="mainAdmin/formationList">Courses</a></li>
            <li><a class="contact-link" href="mainAdmin/slideList">Chapters</a></li>
            <li><a class="contact-link" href="mainAdmin/quizList">Quizzes</a></li>

            <li><a class="contact-link" href="mainAdmin/rdvList">Appointments</a></li>
          </ul>
          <a href="#" class="nav-close"><i class="fal fa-times"></i></a>
        </nav>
      </div>
    </div>

  </div>
</header>

<div class="offcanvas offcanvas-end mobile-offcanvas" tabindex="-1" id="mobileMenu3">
  <div class="offcanvas-header border-bottom">
    <h5 class="fw-bold m-0">Menu</h5>
    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
  </div>

  <div class="offcanvas-body">
    <ul class="list-unstyled mb-4 mobile-menu">
      <li><a class="contact-link d-block py-2" href="mainAdmin/home">Home</a></li>

      <li><a class="contact-link d-block py-2" href="mainAdmin/formationList">Courses</a></li>
      <li><a class="contact-link d-block py-2" href="mainAdmin/slideList">Chapters</a></li>

      <li><a class="contact-link d-block py-2" href="mainAdmin/rdvList">Appointments</a></li>
    </ul>

<div class="d-flex justify-content-end mb-3">
  <a href="/mainAdmin/profile" class="me-3 custom-icon"><i class="fa fa-user"></i></a>
  <a *ngIf="isAuthenticated" href="#" data-bs-toggle="modal" data-bs-target="#logoutModal" class="custom-icon">
    <i class="fa fa-sign-out-alt"></i>
  </a>
</div>

  </div>
</div>
