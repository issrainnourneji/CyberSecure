<header class="header-style-2">

    <div class="header-navbar menu-2 navbar-sticky">
  <div class="container-fluid container-padding">
    <div class="d-flex align-items-center justify-content-between">

      <!-- Logo -->
      <div class="site-logo">
        <a routerLink="/home">
          <img src="../../../assets/images/logo.png" alt="" class="img-fluid" />
        </a>
      </div>

      <!-- Search Bar -->

      <!-- Menu Burger (mobile) -->
                <div class="offcanvas-icon d-block d-lg-none">
          <a href="#" class="nav-toggler" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu2">
            <i class="fal fa-bars"></i>
          </a>
        </div>

      <!-- Navigation -->
      <nav class="site-navbar ms-auto">
        <ul class="primary-menu">
          <li class="current">
            <a class="contact-link" routerLink="/mainUser/home">Home</a>
          </li>

          <li>
            <a class="contact-link" routerLink="/mainUser/formations">Course</a>
          </li>
          <li>
            <a class="contact-link" routerLink="/mainUser/allQuiz" href="#">Quiz</a>
          </li>
          <li>
            <a class="contact-link" routerLink="/mainUser/allCertif">Certificate</a>
          </li>
                              <li>
            <a class="contact-link" routerLink="/mainUser/addRdv">Appointment</a>
          </li>
        </ul>
        <a href="#" class="nav-close"><i class="fal fa-times"></i></a>
      </nav>

      <!-- Boutons -->
      <div class="d-flex align-items-center">

        <!-- Panier -->
        <div class="header-btn ms-3 d-none d-lg-block position-relative">
          <a routerLink="/mainUser/panier" class="btn btn-sm-2 rounded">
            <i class="fal fa-shopping-cart"></i> Panier
          </a>
        </div>

        <!-- Account -->
        <div class="header-btn ms-3 d-none d-lg-block">
          <a routerLink="/mainUser/profile" class="btn btn-sm-2 rounded">
            <i class="fal fa-user me-2"></i>Account
          </a>
        </div>

        <!-- Logout -->
        <div class="header-btn ms-3 d-none d-lg-block">
          <a href="" class="btn btn-grey-outline btn-sm-2 rounded"
             *ngIf="isAuthenticated"
             data-bs-toggle="modal"
             data-bs-target="#logoutModal">
            <i class="fal fa-sign-out-alt me-2"></i>Logout
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

            <!-- Logout Confirmation Modal -->
<div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="logoutModalLabel"><i class="fa fa-sign-out-alt me-2"></i>Confirm Logout</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to log out?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" (click)="confirmLogout()">Logout</button>
      </div>
    </div>
  </div>
</div>
</header>
<!--====== Header End ======-->
<div class="offcanvas offcanvas-end mobile-offcanvas" tabindex="-1" id="mobileMenu2">
  <div class="offcanvas-header border-bottom">
    <h5 class="fw-bold m-0">Menu</h5>
    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
  </div>

  <div class="offcanvas-body">
    <ul class="list-unstyled mb-4 mobile-menu">
      <li><a routerLink="/mainUser/home" class="contact-link d-block py-2">Home</a></li>
      <li><a routerLink="/mainUser/formations" class="contact-link d-block py-2">Course</a></li>
      <li><a routerLink="/mainUser/allQuiz" class="contact-link d-block py-2">Quiz</a></li>
      <li><a routerLink="/mainUser/allCertif" class="contact-link d-block py-2">Certificate</a></li>
      <li><a routerLink="/mainUser/addRdv" class="contact-link d-block py-2">Appointment</a></li>
      <li><a routerLink="/mainUser/profile" class="contact-link d-block py-2"><i class="fal fa-user me-2"></i> Account</a></li>
      <li><a routerLink="/mainUser/panier" class="contact-link d-block py-2"><i class="fal fa-shopping-cart"></i> Panier</a></li>
      <li>
        <a href="#" class="contact-link d-block py-2 text-danger" data-bs-toggle="modal" data-bs-target="#logoutModal">
           <i class="fal fa-sign-out-alt me-2"></i> Logout
        </a>
      </li>
    </ul>
  </div>
</div>
