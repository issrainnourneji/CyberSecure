<header class="header-style-2">
    <div class="header-topbar topbar-noticebar">
        <div class="container-fluid container-padding">
            <div class="row justify-content-center">
                <div class="col-xl-8 col-lg-8">
                   <div class="header-notice text-center">
                        Keep learning with free resources. <a href="#">Learn more</a>
                   </div>
                </div>
            </div>
        </div>
    </div>

    <div class="header-navbar menu-2 navbar-sticky">
        <div class="container-fluid container-padding">
            <div class="d-flex align-items-center justify-content-between">
                <div class="site-logo">
                    <a href="index.html">
                                <img src="../../../assets/images/Muntucyber.png" alt="" class="img-fluid" />
                    </a>
                </div>

                <div class="header-search-bar d-none d-xl-block">
                   <form action="#">
                        <input type="text" class="form-control" placeholder="Search for anything" >
                        <a href="#" class="search-submit"><i class="far fa-search"></i></a>
                   </form>
                </div>

                <div class="offcanvas-icon d-block d-lg-none">
                    <a href="#" class="nav-toggler"><i class="fal fa-bars"></i></a>
                </div>

                <nav class="site-navbar ms-auto">
                    <ul class="primary-menu">
                        <li class="current">
                            <a href="index.html">Home</a>
                        </li>
                        <li>
                          <a href="mainUser/formations">Formations</a>
                        </li>
                        <li>
                            <a href="mainUser/addRdv">RDV</a>
                        </li>
                        <li>
                            <a href="#">Certificats</a>
                        </li>

                        <li>
                            <a href="#">Quizs</a>
                        </li>
                    </ul>

                    <a href="#" class="nav-close"><i class="fal fa-times"></i></a>
                </nav>

                <div class="header-btn border-left-0 ms-3 d-none d-lg-block">
                    <a href="mainUser/profile" class="btn btn-sm-2 rounded"><i class="fal fa-user me-2"></i>Account</a>
                </div>
                <div class="header-btn border-left-0 ms-3 d-none d-lg-block">
                    <a href="" class="btn btn-grey-outline btn-sm-2 rounded" *ngIf="isAuthenticated" data-bs-toggle="modal" data-bs-target="#logoutModal"><i class="fal fa-sign-out-alt me-2"></i>Logout</a>
                </div>
            </div>
        </div>
    </div>
            <!-- Logout Confirmation Modal -->
<div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="logoutModalLabel"><i class="fa fa-sign-out-alt me-2"></i>Confirm Logout</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to log out?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" (click)="confirmLogout()">Logout</button>
      </div>
    </div>
  </div>
</div>
</header>
<!--====== Header End ======-->
