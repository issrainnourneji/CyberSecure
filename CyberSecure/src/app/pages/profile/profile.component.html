<!DOCTYPE html>
<html lang="zxx">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="description" content="Edumel- Education Html Template by dreambuzz">
  <meta name="keywords" content="education,edumel,instructor,lms,online,instructor,dreambuzz,bootstrap,kindergarten,tutor,e learning">
  <meta name="author" content="dreambuzz">

  <title>Edumel- Education Html Template</title>

  <!-- Mobile Specific Meta-->
  <meta name="viewport" content="width=device-width, initial-scale=1">

</head>

<body id="top-header">


<!--====== Header End ======-->
<section class="page-header">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-8">
          <div class="title-block">
            <h1>Profile</h1>
            <ul class="header-bradcrumb justify-content-center">
              <li><a class="headerlien" href="home">Home</a></li>
              <li class="active" aria-current="page">Profile</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
</section>

    <!--shop category start-->
<section class="user-profile container mt-5 mb-5">
  <div class="profile-header position-relative">
    <!-- 🖼️ Couverture -->
    <div class="cover-photo"></div>

    <!-- 👤 Photo de profil -->
    <div class="profile-photo-wrapper">
      <img
        src="https://cdn-icons-png.flaticon.com/512/847/847969.png"
        alt="User photo"
        class="profile-photo"
      />
    </div>
  </div>

  <div class="profile-body text-center mt-5">
<h2 class="user-name fw-bold">
  Welcome {{ userInfo?.name }}
  <span *ngIf="hasCertification" class="badge-container ms-2">
    <img src="../../../assets/images/téléchargement.jpg" alt="Badge réussite" class="badge-img" style="width:24px;height:24px;">
  </span>
</h2>
    <p class="user-role text-muted">{{ userInfo?.role }}</p>

    <div *ngIf="!isEditing; else editFormSection" class="profile-info mt-4">
      <div class="info-item"><strong>Email:</strong> {{ userInfo?.email }}</div>
      <div class="info-item"><strong>Phone:</strong> {{ userInfo?.phoneNumber }}</div>
      <div class="info-item"><strong>Address:</strong> {{ userInfo?.address }}</div>

      <button class="btn-edit mt-4" (click)="editProfile()">
        <i class="fas fa-user-edit me-2"></i> Edit Profile
      </button>
    </div>

    <!-- ✏️ Mode édition -->
    <ng-template #editFormSection>
      <form (ngSubmit)="updateProfile()" #profileForm="ngForm" class="edit-form mt-4 text-start mx-auto">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input
            id="name"
            [(ngModel)]="editForm.name"
            name="name"
            class="form-control"
            placeholder="Enter your name"
            required
          />
        </div>

        <div class="mb-3">
          <label for="phoneNumber" class="form-label">Phone Number</label>
          <input
            id="phoneNumber"
            [(ngModel)]="editForm.phoneNumber"
            name="phoneNumber"
            class="form-control"
            placeholder="Enter your phone number"
          />
        </div>

        <div class="mb-3">
          <label for="address" class="form-label">Address</label>
          <input
            id="address"
            [(ngModel)]="editForm.address"
            name="address"
            class="form-control"
            placeholder="Enter your address"
          />
        </div>

        <div class="d-flex justify-content-center gap-2 mt-3">
          <button type="submit" class="btn-save " style="background: linear-gradient(to right, #912943, #912943) " [disabled]="profileForm.invalid">
            <i class="fas fa-save me-2"></i> Save
          </button>
          <button type="button" class="btn-cancel" (click)="cancelEdit()">
            <i class="fas fa-times me-2"></i> Cancel
          </button>
        </div>
      </form>
    </ng-template>
  </div>
</section>


<!-- Success Modal Compatible WooCommerce -->
<div
  class="modal fade"
  id="successModal"
  tabindex="-1"
  aria-labelledby="successModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content custom-modal">
      <div class="modal-header">
        <h5 class="modal-title" id="successModalLabel">Profile Updated</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>

      <div class="modal-body text-center">
        <i class="bi bi-check-circle-fill success-icon"></i>
        <p>Your profile has been updated successfully!</p>
      </div>

      <div class="modal-footer">
        <button
          type="button"
          class="btn-gradient"
          data-bs-dismiss="modal"
        >
          OK
        </button>
      </div>
    </div>
  </div>
</div>



    <!--shop category end-->

    <!--
    Essential Scripts
    =====================================-->

    <!-- Main jQuery -->
    <script src="assets/vendors/jquery/jquery.js"></script>
    <!-- Bootstrap 5:0 -->
    <script src="assets/vendors/bootstrap/popper.min.js"></script>
    <script src="assets/vendors/bootstrap/bootstrap.js"></script>
    <!-- Counterup -->
    <script src="assets/vendors/counterup/waypoint.js"></script>
    <script src="assets/vendors/counterup/jquery.counterup.min.js"></script>
    <!--  Owl Carousel -->
    <script src="assets/vendors/owl/owl.carousel.min.js"></script>
    <!-- Isotope -->
    <script src="assets/vendors/isotope/jquery.isotope.js"></script>
    <script src="assets/vendors/isotope/imagelaoded.min.js"></script>
    <!-- Animated Headline -->
    <script src="assets/vendors/animated-headline/animated-headline.js"></script>
    <!-- Magnific Popup -->
    <script src="assets/vendors/magnific-popup/jquery.magnific-popup.min.js"></script>

    <script src="assets/js/script.js"></script>


  </body>
  </html>
