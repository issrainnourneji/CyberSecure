

<section class="page-header">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-8">
          <div class="title-block">
            <h1>Users List</h1>
            <ul class="header-bradcrumb justify-content-center">
              <li><a class="headerlien"  href="mainAdmin/home">Home</a></li>
              <li class="active" aria-current="page">Users</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
</section>
<section class="woocommerce single page-wrapper py-5 bg-light">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="card shadow-sm border-0">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle text-center mb-0 bg-white">
                <thead class="table-light">
                  <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Role</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let user of users">
                    <td>{{ user.id }}</td>
                    <td class="fw-bold">{{ user.name }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.phoneNumber }}</td>
                    <td>
                      <span class="badge"
                            [ngClass]="{
                              'bg-success': user.role === 'agent',
                              'bg-primary': user.role === 'admin',
                              'bg-secondary': user.role !== 'admin' && user.role !== 'agent'
                            }">
                        {{ user.role }}
                      </span>
                    </td>
                    <td>
                      <button class="btn btn-gradient btn-sm d-inline-flex justify-content-center align-items-center"
                              style="width: 36px; height: 36px;"
                              (click)="confirmDelete(user.id)">
                        <i class="fa fa-times"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<modal-delete-confirmation [modalParams]="params" (onSubmitModal)="delete()"></modal-delete-confirmation>
<notification></notification>
