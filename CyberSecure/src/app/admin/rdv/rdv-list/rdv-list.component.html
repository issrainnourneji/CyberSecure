<section class="page-header">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-8">
          <div class="title-block">
            <h1>Rendez-vous List</h1>
            <ul class="header-bradcrumb justify-content-center">
              <li><a href="mainAdmin/home">Home</a></li>
              <li class="active" aria-current="page">Rendez-vous</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
</section>

<section class="woocommerce single page-wrapper">
  <div class="container">

    <!-- Message d'erreur -->
    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

    <div class="row">
      <div class="col-12">
        <div class="table-responsive shadow-sm rounded">
          <table class="table table-bordered table-striped align-middle">
            <thead class="text-white" style="background-color: #FF5369;">
              <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Notes</th>
                <th>Status</th>
                <th>Utilisateur</th>
                <th>Email</th>
                <th class="text-center">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let rdv of appointments">
                <td class="fw-bold">{{ rdv.rdvdate | date:'medium' }}</td>
                <td>{{ rdv.rdvtype }}</td>
                <td class="text-truncate" style="max-width: 150px;" [attr.title]="rdv.notes">
                  {{ rdv.notes }}
                </td>
                <td>
                  <span class="badge px-3 py-2"
                        [ngStyle]="{
                          'background-color': rdv.status === 'PENDING' ? '#FFC107' :
                                              rdv.status === 'CONFIRMED' ? '#28A745' :
                                              rdv.status === 'CANCELLED' ? '#DC3545' : '#6C757D',
                          'color': 'white'
                        }">
                    {{ rdv.status }}
                  </span>
                </td>
                <td>{{ rdv.userName }}</td>
                <td>{{ rdv.userEmail }}</td>
        <td class="text-center">
          <!-- Bouton confirmer uniquement si PENDING -->
          <button
            *ngIf="rdv.status === 'PENDING'"
            class="btn btn-sm text-white"
            style="background-color: #FF5369; border: none;"
            (click)="confirmRDV(rdv.id)">
            <i class="fa fa-check"></i> Confirmer
          </button>

          <!-- Message si déjà confirmé -->
          <span *ngIf="rdv.status === 'CONFIRMED'" class="badge bg-success">
            Confirmé
          </span>
        </td>
      </tr>
    </tbody>
  </table>

          <!-- Message si aucune donnée -->
          <div *ngIf="appointments.length === 0" class="text-center py-3">
            <p class="text-muted">Aucun rendez-vous trouvé.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
