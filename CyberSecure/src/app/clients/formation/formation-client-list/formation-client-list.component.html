<section class="page-header">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-8">
          <div class="title-block">
            <h1>Formations</h1>
            <ul class="header-bradcrumb justify-content-center">
              <li><a class="headerlien" href="mainUser/home">Home</a></li>
              <li class="active" aria-current="page">Formation List</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
</section>

<section class="course-wrapper section-padding ">
      <div class="container">

          <div class="row justify-content-lg-center">
              <div class="col-xl-4 col-lg-4 col-md-6"  *ngFor="let formation of filteredFormations">
                  <div class="course-grid bg-shadow tooltip-style">
                      <div class="course-header">
                          <div class="course-thumb">
  <img [src]="'http://localhost:8080/files/' + formation.imageUrl"
       alt="Post Image"
       class="img-fluid"
       style="width:100%; height:200px; object-fit:cover; border-radius:8px;">
</div>

                      </div>

                      <div class="course-content">
                          <div class="rating mb-10">
                              <i class="fa fa-star"></i>
                              <i class="fa fa-star"></i>
                              <i class="fa fa-star"></i>
                              <i class="fa fa-star"></i>
                              <i class="fa fa-star"></i>

                              <span>3.9 (30 reviews)</span>
                          </div>

                          <h3 class="course-title mb-20"> <a class="contact-link" [routerLink]="['/mainUser/chapterList', formation.id]">{{formation.title}}</a> </h3>

                          <div class="course-footer mt-20 d-flex align-items-center justify-content-between ">
                              <span class="duration"><i class="far fa-clock me-2" style="color: #be323d;"></i>{{formation.duration}} hr</span>
<span class="students">
  <i class="far fa-user-alt me-2" style="color: #be323d;"></i>
  {{studentsCount[formation.id] || 0}} Students
</span>
                              <span class="lessons"><i class="far fa-play-circle me-2 " style="color: #be323d;"></i>{{formation.chapitres?.length}} Lessons</span>
                          </div>
                      </div>

                     <div class="course-hover-content">
  <img [src]="'http://localhost:8080/files/' + formation.imageUrl"
       alt="Post Image"
       class="img-fluid"
       style="width:100%; height:200px; object-fit:cover; border-radius:8px;">
       <h3 class="course-title  mt-10 " > <a class="contact-link" [routerLink]="['/mainUser/chapterList', formation.id]">{{formation.title}}</a> </h3>
                          <button [routerLink]="['/mainUser/chapterList', formation.id]" class=" btn-grey btn-sm rounded btn-gradient ">Voir Details  <i class="fal fa-angle-right"></i></button>
                      </div>
                  </div>
               </div>
              <!-- COURSE END -->
          </div>

           <nav class="blog-page-navigation d-flex justify-content-center mt-4" *ngIf="filteredFormations.length > 0">
      <ul class="pagination">

        <li class="pagination-arrow" [class.disabled]="p === 1">
          <a href="javascript:void(0)" (click)="p > 1 && (p = p - 1)">
            <i class="fa fa-angle-double-left"></i>
          </a>
        </li>

        <li *ngFor="let page of getVisiblePages()">
          <a href="javascript:void(0)"
             [class.active]="p === page"
             (click)="p = page">
            {{ page }}
          </a>
        </li>

        <li class="pagination-arrow" [class.disabled]="p === totalPages">
          <a href="javascript:void(0)" (click)="p < totalPages && (p = p + 1)">
            <i class="fa fa-angle-double-right"></i>
          </a>
        </li>

      </ul>
    </nav>
      </div>
  </section>
