<div class="d-flex justify-content-center mb-4 gap-3 flex-wrap">
  <button [routerLink]="['/mainUser/chapterList', formationId]"
          class="btn btn-gradient btn-grey rounded-pill shadow-sm d-flex align-items-center">
    <i class="fal fa-angle-left me-2"></i>
    Revenir aux chapitres
  </button>
  <button class="btn btn-gradient btn-grey rounded-pill shadow-sm d-flex align-items-center"
          (click)="downloadPdf()">
    <i class="fas fa-file-pdf me-2"></i>
    Télécharger les résultats
  </button>


</div>


<div id="quiz-results">
  <div *ngFor="let result of history; let i = index"
       class="card mb-4 shadow border-0 rounded-3"
       [ngClass]="{'border-success': result.success, 'border-danger': !result.success}">

    <div class="card-header bg-light d-flex justify-content-between align-items-center">
      <span class="fw-bold">Tentative #{{ i + 1 }}</span>
      <span class="badge"
            [ngClass]="{'bg-success': result.success, 'bg-danger': !result.success}">
        <i class="fas" [ngClass]="{'fa-check-circle': result.success, 'fa-times-circle': !result.success}"></i>
        {{ result.success ? 'Réussi' : 'Échec' }}
      </span>
    </div>

    <div class="card-body">
      <h5 class="card-title">{{ result.quiz.titre }}</h5>
      <p class="mb-2">
        <strong>Score :</strong> {{ result.score }}%
      </p>

      <p *ngIf="!result.success" class="text-danger fw-semibold">
        <i class="fas fa-exclamation-triangle me-2"></i> Échec : le résultat doit être supérieur à 60% pour réussir.
      </p>

      <p class="text-muted mb-3">
        Passé le : {{ result.datePassed | date:'dd/MM/yyyy HH:mm:ss' }}
      </p>

      <div *ngFor="let question of result.quiz.questions" class="mb-3">
        <strong class="d-block mb-1">{{ question.texte }}</strong>
        <ul class="list-group list-group-flush">
<li *ngFor="let answer of question.reponses"
    class="list-group-item d-flex justify-content-between align-items-center"
    [ngClass]="{

      'list-group-item-success': (result.success && answer.correct)

        || (!result.success && isUserSelected(result.userAnswers, question.id, answer) && answer.correct),


      'list-group-item-danger': !result.success && isUserSelected(result.userAnswers, question.id, answer) && !answer.correct
    }">
  <span>{{ answer.texte }}</span>
  <span>
    <i *ngIf="((result.success && answer.correct) || (!result.success && isUserSelected(result.userAnswers, question.id, answer) && answer.correct))"
       class="fas fa-check-circle text-success"></i>

    <i *ngIf="!result.success && isUserSelected(result.userAnswers, question.id, answer) && !answer.correct"
       class="fas fa-times-circle text-danger"></i>
  </span>
</li>



        </ul>
      </div>
    </div>
  </div>
</div>
