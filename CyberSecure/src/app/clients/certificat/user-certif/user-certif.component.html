<section class="page-header">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-8">
          <div class="title-block">
            <h1>Certification List</h1>
            <ul class="header-bradcrumb justify-content-center">
              <li><a class="headerlien" href="home">Home</a></li>
              <li class="active" aria-current="page">Certifications</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
</section>
<section class="container my-5">

  <div *ngIf="certifications.length > 0; else noCerts" class="row g-4">
    <div *ngFor="let cert of certifications" class="col-md-6 col-lg-4">
      <div class="card h-100 shadow-lg border-0 rounded-4 overflow-hidden hover-scale">
        <div class="card-body">
          <h5 class="card-title fw-semibold">{{ cert.formation?.title }}</h5>
          <br>

          <p class="card-subtitle text-muted mb-2">
            <i class="fas fa-calendar-check me-1" style="color:#681b37"></i>
Émis le : {{ cert.dateObtained | date:'dd/MM/yyyy HH:mm' }}
          </p>
          <p class="mb-3"><i class="fas fa-user me-1" style="color:#681b37"></i>Utilisateur : <span class="fw-medium">{{ cert.user?.name }}</span></p>
          <a [routerLink]="['/mainUser/certification', cert.id]" class="btn btn-gradient w-100 fw-bold ">
            Voir le certificat
          </a>
        </div>
        <div class="card-footer bg-light text-center text-muted small">
         <i class="fas fa-graduation-cap me-1" ></i> Certification Professionnelle
        </div>
      </div>
    </div>
  </div>

  <ng-template #noCerts>
    <div class="text-center py-5">
      <p class="text-muted fs-5">Vous n’avez pas encore de certifications.</p>
    </div>
  </ng-template>
</section>

<style>
  .hover-scale {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .hover-scale:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
  }
</style>
