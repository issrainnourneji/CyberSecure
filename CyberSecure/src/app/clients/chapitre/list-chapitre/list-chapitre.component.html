

<body id="top-header">



<app-header-user></app-header-user><!--====== Header End ======-->
<section class="page-header">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-8">
          <div class="title-block">
            <h1>Chapters List</h1>
            <ul class="header-bradcrumb justify-content-center">
              <li><a href="home">Home</a></li>
              <li class="active" aria-current="page">Chapters</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
</section>
    <!--course section start-->
    <section class="section-padding page" >
        <div class="course-top-wrap">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-lg-8">
                        <p>Showing 1-6 of 8 results</p>
                    </div>

                    <div class="col-lg-4">
                        <div class="topbar-search">
                            <form method="get" action="#">
                                <input type="text"  placeholder="Search our courses" class="form-control">
                                <label><i class="fa fa-search"></i></label>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="container">
            <div class="row ">
                <div class="course-item col-lg-12 col-md-12" *ngFor="let chapitre of formation?.chapitres">
                    <div class="single-course style-2 bg-shade border-0">
                        <div class="row g-0 align-items-center">
                            <div class="col-xl-2">
                                <img class="course-thumb " [src]="'http://localhost:8080/files/' + formation?.imageUrl" >
                            </div>
                            <div class="col-xl-7">
                                <div class="course-content py-9 pt-xl-0">
                                    <h3 class="course-title">   <a [routerLink]="['/chapitre', chapitre.id, 'slides']">{{ chapitre.titre }}</a> </h3>
                                    <div class="course-meta d-flex align-items-center">
                                        <span class="students"><i class="far fa-user-alt"></i>{{formation.numberOfStudents}}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!--course-->
    </section>
    <!--course section end-->


<!-- Footer section start -->
<app-footer></app-footer>
<!-- Footer section End -->






    <!--
    Essential Scripts
    =====================================-->

    <!-- Main jQuery -->
    <script src="assets/vendors/jquery/jquery.js"></script>
    <!-- Bootstrap 5:0 -->
    <script src="assets/vendors/bootstrap/popper.min.js"></script>
    <script src="assets/vendors/bootstrap/bootstrap.js"></script>
    <!-- Counterup -->
    <script src="assets/vendors/counterup/waypoint.js"></script>
    <script src="assets/vendors/counterup/jquery.counterup.min.js"></script>
    <!--  Owl Carousel -->
    <script src="assets/vendors/owl/owl.carousel.min.js"></script>
    <!-- Isotope -->
    <script src="assets/vendors/isotope/jquery.isotope.js"></script>
    <script src="assets/vendors/isotope/imagelaoded.min.js"></script>
    <!-- Animated Headline -->
    <script src="assets/vendors/animated-headline/animated-headline.js"></script>
    <!-- Magnific Popup -->
    <script src="assets/vendors/magnific-popup/jquery.magnific-popup.min.js"></script>

    <script src="assets/js/script.js"></script>


  </body>
